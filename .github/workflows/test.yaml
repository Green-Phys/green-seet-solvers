name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    # Build and test on the newest macOS runner (Apple silicon), Homebrew toolchain.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install open-mpi hdf5 eigen openblas 

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DBuild_Tests=ON
          cmake --build build -j 3

      - name: Test
        env:
          HDF5_USE_FILE_LOCKING: 'FALSE'
          OMP_NUM_THREADS: 1
        run: |
          ctest --test-dir build -j 1 --output-on-failure

  build:

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |        
        sudo apt-get update
        sudo apt-get install openmpi-bin openmpi-common libopenmpi-dev
        sudo apt-get install libhdf5-serial-dev
        sudo apt-get install libeigen3-dev
        sudo apt-get install libopenblas-dev 
        sudo apt-get install lcov

        cmake -S . -B build -DBuild_Tests=ON -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage ";
        cmake --build build -j 4;

    - name: Test
      run: |
        cd build;
        ctest -j1;
    - name: Run coverage
      run: |
        cd build;
        lcov --ignore-errors source,source --capture --directory . --output-file coverage.info;
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
